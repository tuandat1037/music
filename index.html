<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Static Music Player">
    <title>Static Music Player</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/player.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
           <main class="container">
        <header class="header">
            <a href="/" class="logo" aria-label="Music Player Home">
                <img src="https://images.icon-icons.com/3919/PNG/256/spotify_icon_249861.png" alt="Logo Music Player">
            </a>
            <div class="header-controls">
                <div class="search-box">
                    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    <input type="text" id="search-input" placeholder="Tìm kiếm bài hát, ca sĩ..." aria-label="Search">
                </div>
                <button id="theme-toggle" class="btn-icon theme-toggle-btn" title="Chuyển giao diện Sáng/Tối"></button>
            </div>
        </header>
        
        <!-- Thêm màn hình Now Playing ở đây -->
        <section id="now-playing-view" class="now-playing-view">
            <div class="np-overlay"></div>
            <button id="back-btn" class="btn-icon back-btn" title="Quay lại danh sách">
    <!-- Đổi icon thành mũi tên chỉ xuống -->
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><polyline points="19 12 12 19 5 12"></polyline></svg>
</button>

            <div class="np-content">
                <img id="np-cover" src="" alt="Cover" class="np-cover-img">
                <h2 id="np-title" class="np-title">Chưa chọn bài hát</h2>
                <p id="np-artist" class="np-artist">-</p>
            </div>
        </section>

        <section class="playlist-section">
            <div id="loading-skeleton" class="skeleton-container"></div>
            <ul id="playlist" class="playlist"></ul>
        </section>
    </main>

    <footer class="player-bar">
        <div class="player-info">
<img id="current-cover" src="https://i.pinimg.com/736x/cd/40/4a/cd404ae724fcdb96429616befd5396a0.jpg" alt="Cover" class="current-cover">
            <div class="track-info">
                <span id="current-title" class="track-title">Chưa chọn bài hát</span>
                <span id="current-artist" class="track-artist">-</span>
            </div>
        </div>
        
        <div class="player-controls">
            <div class="control-buttons">
    <button id="shuffle-btn" class="btn-icon" title="Shuffle">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 3 21 3 21 8"></polyline><line x1="4" y1="20" x2="21" y2="3"></line><polyline points="21 16 21 21 16 21"></polyline><line x1="15" y1="15" x2="21" y2="21"></line><line x1="4" y1="4" x2="9" y2="9"></line></svg>
    </button>
    <button id="prev-btn" class="btn-icon" title="Previous">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="19 20 9 12 19 4 19 20"></polygon><line x1="5" y1="19" x2="5" y2="5"></line></svg>
    </button>
    <button id="play-pause-btn" class="btn-icon play-btn" title="Play">
        <svg id="play-icon" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
        <svg id="pause-icon" viewBox="0 0 24 24" fill="currentColor" style="display:none"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>
    </button>
    <button id="next-btn" class="btn-icon" title="Next">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 4 15 12 5 20 5 4"></polygon><line x1="19" y1="5" x2="19" y2="19"></line></svg>
    </button>
    <button id="repeat-btn" class="btn-icon" title="Repeat">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"></polyline><path d="M3 11V9a4 4 0 0 1 4-4h14"></path><polyline points="7 23 3 19 7 15"></polyline><path d="M21 13v2a4 4 0 0 1-4 4H3"></path></svg>
    </button>
</div>

            <div class="progress-container">
                <span id="current-time" class="time">00:00</span>
                <input type="range" id="progress-bar" class="progress-bar" min="0" max="100" value="0" step="0.1" aria-label="Seek">
                <span id="duration-time" class="time">00:00</span>
            </div>
        </div>
        
        <div class="player-volume">
            <button id="mute-btn" class="btn-icon" title="Mute">
    <svg id="volume-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
    <svg id="mute-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line></svg>
</button>
            <input type="range" id="volume-bar" class="volume-bar" min="0" max="1" value="1" step="0.01" aria-label="Volume">
        </div>
        
        <audio id="audio-player" preload="metadata"></audio>
        <div id="toast" class="toast"></div>
    </footer>

    <script type="module" src="js/app.js"></script>
</body>
</html>
